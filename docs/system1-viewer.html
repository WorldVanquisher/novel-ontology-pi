const PAGES = {"index.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Overview — System 1 Design · novel-ontology-pi</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:thin}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"kicker\">detailed design · overview</div>\n<h1>System 1 — The Autostep Miniloop</h1>\n<p class=\"sub\">The fast, local decision system inside the CLI. It reads a novel the way a careful\nreader skims structure — where scenes break, which sentences are dialogue, whose names appear,\nwho is actually in the room, who is speaking. It <b>decides structure</b>; it never writes the\nontology. Everything it concludes becomes a proposal for the main agent to approve at the merge gate.</p>\n<p>\n  <span class=\"badge v1\">design v0.1</span>\n  <span class=\"badge open\">patch catalog: open for discussion</span>\n  <span class=\"badge\">companion: <a href=\"../../DESIGN.md\">DESIGN.md</a></span>\n</p>\n\n<h2>The architecture</h2>\n<div class=\"panel\" style=\"padding:10px\">\n<svg class=\"arch\" viewBox=\"0 0 1180 640\" role=\"img\" aria-label=\"Architecture graph of novel-ontology-pi\">\n  <defs>\n    <marker id=\"arr\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\">\n      <path d=\"M0,0 L10,5 L0,10 z\" fill=\"#3d4a6b\"></path>\n    </marker>\n  </defs>\n\n  <!-- USER -->\n  <rect class=\"box\" x=\"16\" y=\"270\" width=\"158\" height=\"120\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"95\" y=\"298\" text-anchor=\"middle\">👤 User</text>\n  <text class=\"small\" x=\"95\" y=\"320\" text-anchor=\"middle\">drops in a novel</text>\n  <text class=\"small\" x=\"95\" y=\"338\" text-anchor=\"middle\">provides 2 API keys</text>\n  <text class=\"small\" x=\"95\" y=\"356\" text-anchor=\"middle\">selects fork points</text>\n  <text class=\"small\" x=\"95\" y=\"374\" text-anchor=\"middle\">asks · simulates</text>\n\n  <!-- SYSTEM 2 ZONE -->\n  <rect class=\"zone\" x=\"206\" y=\"14\" width=\"660\" height=\"104\" rx=\"16\"></rect>\n  <text class=\"zonelabel\" x=\"222\" y=\"36\">SYSTEM 2 — MAIN AGENT</text>\n  <rect class=\"box sys2\" x=\"330\" y=\"44\" width=\"340\" height=\"56\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"500\" y=\"69\" text-anchor=\"middle\">Pi agent + SKILL.md</text>\n  <text class=\"small\" x=\"500\" y=\"87\" text-anchor=\"middle\">workflows · merge reviewer · memory + context</text>\n\n  <!-- SYSTEM 1 ZONE -->\n  <rect class=\"zone\" x=\"206\" y=\"140\" width=\"660\" height=\"330\" rx=\"16\"></rect>\n  <text class=\"zonelabel\" x=\"222\" y=\"162\">SYSTEM 1 — THE CLI</text>\n\n  <rect class=\"box\" x=\"226\" y=\"186\" width=\"180\" height=\"62\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"316\" y=\"211\" text-anchor=\"middle\">✂️ Sectioning</text>\n  <text class=\"small\" x=\"316\" y=\"229\" text-anchor=\"middle\">code only · sentences + IDs</text>\n\n  <rect class=\"box sys1\" x=\"446\" y=\"186\" width=\"210\" height=\"62\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"551\" y=\"211\" text-anchor=\"middle\">🧠 Autostep miniloop</text>\n  <text class=\"small\" x=\"551\" y=\"229\" text-anchor=\"middle\">decision patches over Jev</text>\n\n  <rect class=\"box\" x=\"686\" y=\"186\" width=\"164\" height=\"62\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"768\" y=\"211\" text-anchor=\"middle\">📚 Extraction</text>\n  <text class=\"small\" x=\"768\" y=\"229\" text-anchor=\"middle\">work LLM, per scene</text>\n\n  <rect class=\"box\" x=\"226\" y=\"286\" width=\"180\" height=\"62\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"316\" y=\"311\" text-anchor=\"middle\">⌘ CLI commands</text>\n  <text class=\"small\" x=\"316\" y=\"329\" text-anchor=\"middle\">query · fork · simulate</text>\n\n  <rect class=\"box\" x=\"446\" y=\"286\" width=\"210\" height=\"62\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"551\" y=\"311\" text-anchor=\"middle\">📝 ChangeSet</text>\n  <text class=\"small\" x=\"551\" y=\"329\" text-anchor=\"middle\">proposals accumulate per block</text>\n\n  <rect class=\"box sys1\" x=\"686\" y=\"286\" width=\"164\" height=\"62\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"768\" y=\"311\" text-anchor=\"middle\">🛂 Merge gate</text>\n  <text class=\"small\" x=\"768\" y=\"329\" text-anchor=\"middle\">applies on approval only</text>\n\n  <!-- STORAGE ZONE -->\n  <rect class=\"zone\" x=\"206\" y=\"492\" width=\"660\" height=\"118\" rx=\"16\"></rect>\n  <text class=\"zonelabel\" x=\"222\" y=\"514\">ONTOLOGY STORAGE — EMBEDDED, NO DOCKER</text>\n  <rect class=\"box\" x=\"226\" y=\"524\" width=\"280\" height=\"62\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"366\" y=\"549\" text-anchor=\"middle\">📦 Bundle (JSONL)</text>\n  <text class=\"small\" x=\"366\" y=\"567\" text-anchor=\"middle\">source of truth · portable · git-friendly</text>\n  <rect class=\"box\" x=\"546\" y=\"524\" width=\"300\" height=\"62\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"696\" y=\"549\" text-anchor=\"middle\">🐞 Ladybug — graph.lbug</text>\n  <text class=\"small\" x=\"696\" y=\"567\" text-anchor=\"middle\">Cypher · vector index · full-text search</text>\n\n  <!-- EXTERNAL APIS -->\n  <rect class=\"box ext\" x=\"896\" y=\"186\" width=\"268\" height=\"62\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"1030\" y=\"211\" text-anchor=\"middle\">🎯 Jev — decision model</text>\n  <text class=\"small\" x=\"1030\" y=\"229\" text-anchor=\"middle\">noul · choice · score — user API #2</text>\n  <rect class=\"box ext\" x=\"896\" y=\"286\" width=\"268\" height=\"62\" rx=\"12\"></rect>\n  <text class=\"title\" x=\"1030\" y=\"311\" text-anchor=\"middle\">✍️ Work LLM</text>\n  <text class=\"small\" x=\"1030\" y=\"329\" text-anchor=\"middle\">generation model — user API #1</text>\n\n  <!-- EDGES -->\n  <path id=\"pIn\" class=\"edge hot flowdash\" d=\"M174 285 C 245 285, 245 72, 328 72\"></path>\n  <text class=\"elabel\" transform=\"rotate(-90 196 180)\" x=\"196\" y=\"180\" text-anchor=\"middle\">novel · requests · keys</text>\n\n  <path class=\"edge\" d=\"M380 100 C 380 150, 316 150, 316 184\"></path>\n  <text class=\"elabel\" x=\"352\" y=\"138\" text-anchor=\"middle\">CLI commands (JSON)</text>\n\n  <path class=\"edge\" d=\"M406 217 L444 217\"></path>\n  <text class=\"elabel\" x=\"425\" y=\"207\" text-anchor=\"middle\">IDs</text>\n  <path class=\"edge\" d=\"M656 217 L684 217\"></path>\n  <text class=\"elabel\" x=\"670\" y=\"207\" text-anchor=\"middle\">scenes</text>\n\n  <path id=\"pJev\" class=\"edge jev flowdash\" d=\"M656 200 C 760 158, 815 198, 894 205\"></path>\n  <path class=\"edge jev\" d=\"M894 232 C 815 258, 760 242, 658 234\"></path>\n  <text class=\"elabel\" x=\"778\" y=\"152\" text-anchor=\"middle\">batched questions</text>\n  <text class=\"elabel\" x=\"778\" y=\"266\" text-anchor=\"middle\">probabilities</text>\n\n  <path class=\"edge llm\" d=\"M850 205 L894 205\"></path>\n  <path class=\"edge llm\" d=\"M894 232 L852 232\"></path>\n\n  <path class=\"edge\" d=\"M551 248 L551 284\"></path>\n  <text class=\"elabel\" x=\"560\" y=\"270\">proposals</text>\n  <path class=\"edge\" d=\"M740 248 L740 317 L658 317\"></path>\n  <text class=\"elabel\" x=\"748\" y=\"286\">events · causality</text>\n\n  <path class=\"edge\" d=\"M656 317 L684 317\"></path>\n  <text class=\"elabel\" x=\"670\" y=\"307\" text-anchor=\"middle\">pending</text>\n\n  <path id=\"pReview\" class=\"edge hot flowdash\" d=\"M742 286 C 742 150, 706 84, 672 70\"></path>\n  <text class=\"elabel\" x=\"756\" y=\"180\">ChangeSet for review ↑</text>\n  <text class=\"elabel\" x=\"756\" y=\"196\">approve · hold · revise ↓</text>\n\n  <path id=\"pMerge\" class=\"edge hot flowdash\" d=\"M742 348 C 742 468, 420 478, 382 522\"></path>\n  <text class=\"elabel\" x=\"590\" y=\"466\" text-anchor=\"middle\">approved merge only</text>\n\n  <path class=\"edge\" d=\"M316 348 C 316 470, 302 500, 302 522\"></path>\n  <text class=\"elabel\" transform=\"rotate(-90 292 440)\" x=\"292\" y=\"440\" text-anchor=\"middle\">queries read the graph</text>\n\n  <path class=\"edge\" d=\"M506 555 L544 555\"></path>\n  <text class=\"elabel\" x=\"525\" y=\"545\" text-anchor=\"middle\">rebuild</text>\n\n  <path class=\"edge\" d=\"M700 586 L700 624 L95 624 L95 392\"></path>\n  <text class=\"elabel\" x=\"400\" y=\"616\" text-anchor=\"middle\">answers · character simulation · parallel-universe forks</text>\n\n  <!-- moving pulses -->\n  <circle class=\"pulse\" r=\"4\"><animateMotion dur=\"3.2s\" repeatCount=\"indefinite\"><mpath href=\"#pIn\"/></animateMotion></circle>\n  <circle class=\"pulse\" r=\"4\" fill=\"#c084fc\"><animateMotion dur=\"2.2s\" repeatCount=\"indefinite\"><mpath href=\"#pJev\"/></animateMotion></circle>\n  <circle class=\"pulse\" r=\"4\"><animateMotion dur=\"3.8s\" repeatCount=\"indefinite\"><mpath href=\"#pMerge\"/></animateMotion></circle>\n</svg>\n</div>\n\n<p class=\"sub\"><b>Rule zero:</b> never ask a model what code can compute exactly. Sectioning, offsets,\nand scanning for <i>known</i> names are code. Jev is only asked genuinely ambiguous questions — and it\nanswers with probabilities, not text, in ~70–500&nbsp;ms, batched: one call per window, all questions at once.\nThe one hard boundary in the graph: <b>nothing crosses from ChangeSet to storage except through the\nmerge gate, on the main agent's approval.</b></p>\n\n<h2>The sectors — one page per functionality</h2>\n<a class=\"card\" href=\"roadmap.html\" style=\"margin-bottom:14px;border-color:var(--teal)\"><h3>🗺 Roadmap — implementation timeline &amp; decision log</h3>\n<p>Phases 0–5 in implementation order, the milestone that ends each, which open questions get decided in which phase — and the standing rule: <b>this page is updated in GitHub every time something is completed.</b></p><span class=\"go\">Open the roadmap →</span></a>\n<p class=\"sub\">This site is divided the way the repo is: by the <b>functional sectors we will\nimplement</b>, in pipeline order. Every sector page follows the same structure —\n<b>what it does → its own demo → design details → implementation mapping → open questions\nfor that sector only</b>.</p>\n\n<h3 style=\"margin-top:22px\">Phase A — Structure <span style=\"color:var(--faint);font-size:13px\">(System 1: from raw text to structure)</span></h3>\n<div class=\"grid three\">\n  <a class=\"card\" href=\"sectioning.html\"><h3>01 · Sectioning</h3><p>Intake &amp; auto sentence segregation. Deterministic code — the only sector with no model at all.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"scene-boundary.html\"><h3>02 · Scene boundary</h3><p>Patch: where scenes start, and why — location, time, viewpoint.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"dialogue-detector.html\"><h3>03 · Dialogue detector</h3><p>Patch: which sentences are dialogue, stitched into turns.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"name-detector.html\"><h3>04 · Name detector</h3><p>Patch: known names by code scan; new names &amp; nicknames by decision.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"presence-detector.html\"><h3>05 · Presence detector</h3><p>Patch: who is in the scene vs. merely mentioned.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"speaker-attribution.html\"><h3>06 · Speaker attribution</h3><p>Patch: which character each dialogue belongs to — and who it addresses.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"miniloop-engine.html\"><h3>07 · Miniloop engine</h3><p>The autostep loop itself: windows, batched Jev calls, confidence gates, recursion.</p><span class=\"go\">Open →</span></a>\n</div>\n\n<h3 style=\"margin-top:22px\">Phase B — Knowledge <span style=\"color:var(--faint);font-size:13px\">(from structure to the ontology, through the gate)</span></h3>\n<div class=\"grid three\">\n  <a class=\"card\" href=\"extraction.html\"><h3>08 · Extraction</h3><p>The work LLM reads structured scenes and proposes events, causality, state changes.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"merge-gate.html\"><h3>09 · Merge gate</h3><p>Block-by-block rolling; ChangeSets accumulate; the main agent approves, holds, revises.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"storage-connectors.html\"><h3>10 · Storage connectors</h3><p>Upload/query: the JSONL bundle (truth) and the Ladybug graph engine (hot queries).</p><span class=\"go\">Open →</span></a>\n</div>\n\n<h3 style=\"margin-top:22px\">Phase C — Use <span style=\"color:var(--faint);font-size:13px\">(what the ontology powers)</span></h3>\n<div class=\"grid three\">\n  <a class=\"card\" href=\"timeline-forking.html\"><h3>11 · Timelines &amp; forking</h3><p>Canon as an event timeline; the user picks a time point; a branch forks, canon untouched.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"simulation.html\"><h3>12 · Simulation</h3><p>Character state as a fold of events; roleplay that knows only what the character should know.</p><span class=\"go\">Open →</span></a>\n  <a class=\"card\" href=\"../../DESIGN.md\"><h3>📐 DESIGN.md</h3><p>The overall architecture in document form: decisions, schema v1, CLI surface, test plan.</p><span class=\"go\">Read the doc →</span></a>\n</div>\n\n<h3 style=\"margin-top:22px\">Phase D — Experience <span style=\"color:var(--faint);font-size:13px\">(watching the system think)</span></h3>\n<div class=\"grid three\">\n  <a class=\"card\" href=\"playground-frontend.html\"><h3>13 · Playground frontend</h3><p>The live theater: pipeline strip, growing 3D graph (Reagraph), decision stream, gate queue — transparency for users, replay for debugging.</p><span class=\"go\">Open →</span></a>\n</div>\n\n<h2>Two loops, in one breath</h2>\n<div class=\"flow\">\n  <div class=\"node\"><b>📖 Novel block</b><span>one chapter, or a long block, any language</span></div>\n  <div class=\"arrow\">→</div>\n  <div class=\"node\"><b>✂️ Sectioning</b><span>deterministic code — sentences, IDs, offsets</span></div>\n  <div class=\"arrow\">→</div>\n  <div class=\"node\" style=\"border-color:var(--teal)\"><b>🧠 Miniloop</b><span>decision patches over Jev</span></div>\n  <div class=\"arrow\">→</div>\n  <div class=\"node\"><b>📝 ChangeSet</b><span>proposals for this block</span></div>\n  <div class=\"arrow\">→</div>\n  <div class=\"node\"><b>🛂 Merge gate</b><span>main agent decides</span></div>\n</div>\n\n<footer>novel-ontology-pi · System 1 detailed design · v0.1 · 2026-10-21 ·\nCode: <code>src/autostep/</code> · Doc: <a href=\"../../DESIGN.md\">DESIGN.md</a></footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  const links = [\n    `<a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a>`,\n    `<a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>`,\n    ...SECTORS.map(\n      (s) =>\n        `<a class=\"page ${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} ${s.label}</a>`,\n    ),\n  ].join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>System 1 · design by sector</small></a><div class=\"links\">${links}</div>`;\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","roadmap.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>Roadmap — novel-ontology-pi design dashboard</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:thin}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"kicker\">dashboard · implementation timeline</div>\n<h1>Roadmap — implementation order &amp; decision log</h1>\n<p class=\"sub\">The work, sequenced. Each phase lists what gets built (with the sectors it touches),\nthe milestone that ends it, and the open questions that get decided <i>in that phase</i> — nothing\nis decided earlier than it needs to be.</p>\n<div class=\"panel\" style=\"border-color:var(--teal)\">\n  <b>Update rule:</b> this page is updated in GitHub <b>every time something is completed</b> —\n  phase statuses and the decision log here are the project's progress record of truth.\n  <span style=\"color:var(--dim)\">Last updated: 2026-10-21 · Phase 1 core implemented; sector 13 playground frontend v1 built and merged (PR #4); model wiring waits on keys.</span>\n</div>\n\n<div class=\"rtl\">\n\n  <div class=\"rphase done\">\n    <h3>Phase 0 — Foundation <span class=\"status done\">✓ done · 2026-10-21</span></h3>\n    <ul>\n      <li>Founding design (DESIGN.md), English-canonical schema v1, Pi Skill</li>\n      <li>CLI skeleton: sectioning working, miniloop + v1 decision patches, ChangeSet / merge machinery</li>\n      <li>Connector interfaces: Ladybug · bundle · Jev · work LLM — tests green with a mocked Jev</li>\n      <li>This design dashboard: overview + 12 sector pages + single-file viewer</li>\n    </ul>\n    <p class=\"mile\">Milestone: repo live at gardianofthedarkness/novel-ontology-pi, skeleton verified.</p>\n  </div>\n\n  <div class=\"rphase now\">\n    <h3>Phase 1 — Live, end to end, on one test novel <span class=\"status now\">● in progress</span></h3>\n    <ul>\n      <li><b>Storage wiring</b> (10) <span class=\"status done\">✓ done</span> — real Ladybug driver (<code>@ladybugdb/core</code>): schema DDL applied, bundle → graph build, parameterized Cypher</li>\n      <li><b>Cypher-sufficiency experiment</b> (10) <span class=\"status done\">✓ built</span> — graph-only retrieval layer: presence, co-presence, causal ancestors/descendants, scene location, character event streams, fork points. Embeddings DEFERRED until one of these provably falls short</li>\n      <li><b>Block cutting</b> (01) <span class=\"status done\">✓ done</span> — multilingual chapter detection + paragraph-boundary blocks (<code>novel blocks</code>)</li>\n      <li><b>Gate tooling</b> (09) <span class=\"status done\">✓ done</span> — ChangeSet persistence + <code>changeset list|show|approve|hold</code>; approve applies to the bundle and rebuilds the graph (verified end to end in tests)</li>\n      <li><b>Model wiring</b> (07/08) — Jev client live; DeepSeek as the work LLM via the provider layer. <span style=\"color:var(--dim)\">Plumbing landed 2026-10-21 (PR #8): OpenAI-compatible <code>HttpWorkModel</code> + <code>novel llm ping|probe</code>, mock-tested only. Jev side landed the same day (PR #11): the CLI holds its own secure key store (<code>novel jev login|status|logout|ping</code>, env → store → indirection resolution) and the JevClient speaks the real System One wire format — verified locally end to end against the live API. Live ingest wiring still waits on the corpus.</span></li>\n      <li><b>Extraction step</b> (08) — per-scene LLM extraction inside the block processor</li>\n    </ul>\n    <p class=\"mile\">Milestone: one real chapter of Index → ChangeSet → main-agent review → merged into Ladybug → queried back.</p>\n    <p style=\"color:var(--dim);font-size:13px\">Waiting on: Jev key handover (secure entry) · DeepSeek key · the Index corpus file. Remaining Phase-1 work is exactly the two items above without ✓.</p>\n  </div>\n\n  <div class=\"rphase\">\n    <h3>Phase 2 — Miniloop quality <span class=\"status plan\">planned</span></h3>\n    <ul>\n      <li><b>Name candidates, full build</b> (04): cumulative per-novel name registry scan + zero-context LLM extraction for new names</li>\n      <li><b>Calibration</b> (07): gate thresholds + window size measured on a golden chapter</li>\n      <li><b>Presence ranges</b> (05): entrances/exits mid-scene · <b>speech-tag attachment</b> (03)</li>\n      <li><b>Story-so-far digest</b> (07): cross-window memory in the state summary</li>\n    </ul>\n    <p class=\"mile\">Milestone: the miniloop's decisions are measured, not hoped — precision/recall known per patch.</p>\n    <p style=\"color:var(--dim);font-size:13px\">Parallel track — <b>Playground frontend</b> (13): event emission from the CLI + Live Theater v1 on Reagraph, so ingestion becomes watchable as soon as live models land. <b>Landed 2026-10-21:</b> the frontend v1 is built and merged to main (PR #4) — unified one-world view in <code>apps/playground</code> (three.js via Reagraph, React 19), reading local bundle files (<code>public/db/novel/</code>) behind the real EventSource interface, gate queue with distinct held-ghost state, verified end-to-end headlessly. Next on this track: the CLI's event emission (<code>novel watch</code> / SSE) so the same UI runs on live ingestion. <b>Redesign merged 2026-10-21</b> (PR #9): fullscreen dark narrative-archive presentation — event files as archive cards on straight directed tracks, character spheres, semantic zoom (scroll/pinch into a file, zoom back out to return), collapsible Record / Activity / Review sheets, relations on by default, overview ghosts tethered to their parent file.</p>\n  </div>\n\n  <div class=\"rphase\">\n    <h3>Phase 3 — Whole-novel ingestion <span class=\"status plan\">planned</span></h3>\n    <ul>\n      <li><b>Gate at scale</b> (09): revision granularity, review digest, cross-block consistency checks</li>\n      <li><b>Storage at scale</b> (10): incremental Ladybug sync, multi-novel library layout</li>\n      <li><b>Robustness</b> (01/02/03/04/06): damaged text, unquoted dialogue, style profiles, name collisions, cross-language merges, first-person narration, scene granularity</li>\n    </ul>\n    <p class=\"mile\">Milestone: a full novel ingested block by block, human hands only at the gate.</p>\n  </div>\n\n  <div class=\"rphase\">\n    <h3>Phase 4 — The use phase <span class=\"status plan\">planned</span></h3>\n    <ul>\n      <li><b>Timelines &amp; forking</b> (11): fork-point browser, branch creation, pinned state snapshots, divergence scoring</li>\n      <li><b>Simulation v1</b> (12): one character, folded state, voice from their own turns, Jev referee in flag-only mode</li>\n    </ul>\n    <p class=\"mile\">Milestone: pick a time point, fork the world, talk to someone who lives there.</p>\n  </div>\n\n  <div class=\"rphase\">\n    <h3>Phase 5 — Expansion <span class=\"status plan\">planned</span></h3>\n    <ul>\n      <li>Multi-character simulation (12) · branch auto-discovery (11) · auto-approval envelope (09)</li>\n      <li>Bundle-in-git (10) · candidate patches: addressee, state-change, event-worthiness, causal-candidate, coreference, foreshadowing</li>\n      <li>Discord as a thin client over the CLI</li>\n    </ul>\n    <p class=\"mile\">Milestone: the platform the original Discord bot wanted to be — on the new foundation.</p>\n  </div>\n\n</div>\n\n<h2>Decision log</h2>\n<table class=\"dec\">\n  <tr><th style=\"width:36px\">#</th><th>Decision</th><th>Choice</th><th style=\"width:150px\">Status</th></tr>\n  <tr><td>1</td><td>First test novel</td><td>Re-ingest the legacy <i>Index</i> corpus</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>2</td><td>Jev access</td><td>He has an API; route settled at handover</td><td><span class=\"status now\">key pending</span></td></tr>\n  <tr><td>3</td><td>Work LLM for testing</td><td>DeepSeek API (his), via the Pi provider layer</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>4</td><td>Embedding model</td><td><b>Deferred</b> (revised 2026-10-21): graph-first — verify relational Cypher can't satisfy our needs before adding any embedding model. Fallback if needed: lightweight local CPU model (~500–1000 dims), vector recall top-32 → Jev post-selection</td><td><span class=\"status plan\">deferred</span></td></tr>\n  <tr><td>5</td><td>Name-candidate generation</td><td>Hybrid: plain-text scan against a <b>cumulative registry of every name ever seen in this novel</b>; a new candidate triggers a <b>zero-context LLM call</b> to extract the new name</td><td><span class=\"status done\">✓ decided</span></td></tr>\n  <tr><td>6</td><td>Playground frontend (sector 13)</td><td><b>Reagraph</b> (React, true 3D, clustering/badges built in) + React Flow pipeline strip; <b>standalone-first, host-agnostic</b> — a VS Code webview wrap stays possible later; extension-host research concluded no existing app provides this for free</td><td><span class=\"status done\">✓ decided</span></td></tr>\n</table>\n\n<h2>How open questions map to phases</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><b>Phase 1:</b> block cutting &amp; chapter detection (01) · embedding model pick (10) · state dimensions default from legacy (08)</li>\n  <li><b>Phase 2:</b> thresholds &amp; window size (07) · off-screen presence (05) · escalation budget (07)</li>\n  <li><b>Phase 3:</b> revision granularity, review digest, auto-approval pre-checks (09) · incremental sync, library layout, bundle-in-git (10) · scene granularity &amp; soft boundaries (02) · thought conventions &amp; nested quotation (03) · collisions &amp; title-vs-alias (04) · groups &amp; non-person presence (05)</li>\n  <li><b>Phase 4:</b> divergence measure, branch-of-branch, canon updates under branches (11) · referee strictness, talk-becomes-story threshold (12)</li>\n  <li><b>Phase 5:</b> branch auto-discovery (11) · multi-character turn-taking (12) · voice drift control (12)</li>\n</ul>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · design dashboard · roadmap v0.2 · updated 2026-10-21</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  const links = [\n    `<a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a>`,\n    `<a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>`,\n    ...SECTORS.map(\n      (s) =>\n        `<a class=\"page ${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} ${s.label}</a>`,\n    ),\n  ].join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>System 1 · design by sector</small></a><div class=\"links\">${links}</div>`;\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","playground-frontend.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>13 · Playground frontend — System 1 design · novel-ontology-pi</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:thin}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n<style>\n  .pg { background:#0a0e16; border:1px solid var(--line); border-radius:14px; overflow:hidden }\n  .pgbar { display:flex; align-items:center; gap:8px; padding:8px 12px; background:#111827;\n    border-bottom:1px solid var(--line); font-size:12px; color:var(--dim) }\n  .pgbar .dot3 { width:10px; height:10px; border-radius:50% }\n  .live { margin-left:auto; color:#f87171; font-weight:700; letter-spacing:.08em; font-size:11px }\n  .live i { display:inline-block; width:7px; height:7px; border-radius:50%; background:#f87171;\n    margin-right:5px; animation:blink 1.1s infinite }\n  @keyframes blink { 50% { opacity:.25 } }\n  .pgmain { display:grid; grid-template-columns: 172px 1fr 208px; min-height:308px }\n  .pipe { border-right:1px solid var(--line); padding:10px; display:flex; flex-direction:column; gap:7px }\n  .pstage { border:1px solid var(--line); border-radius:9px; padding:6px 9px; font-size:11.5px;\n    color:var(--faint); background:var(--panel); transition:all .3s }\n  .pstage b { display:block; font-size:12px; color:var(--dim) }\n  .pstage.on { border-color:var(--teal); color:var(--teal); box-shadow:0 0 12px rgba(45,212,191,.25) }\n  .pstage.on b { color:var(--ink) }\n  .pstage.done { border-color:var(--green); color:var(--green) }\n  .blockchip { font-size:11px; border:1px dashed var(--amber); color:var(--amber); border-radius:99px;\n    padding:3px 9px; text-align:center; opacity:0; transition:opacity .4s }\n  .blockchip.show { opacity:1 }\n  .stage3d { position:relative }\n  .stage3d svg { width:100%; height:100%; display:block }\n  .feed { border-left:1px solid var(--line); padding:10px; font-size:11.5px; overflow:hidden }\n  .feed h4 { margin:0 0 7px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint) }\n  .feed li { list-style:none; margin:0 0 6px; color:var(--dim); opacity:0; transform:translateX(8px);\n    transition:all .45s; line-height:1.45 }\n  .feed li.show { opacity:1; transform:none }\n  .feed ul { margin:0; padding:0 }\n  .feed
