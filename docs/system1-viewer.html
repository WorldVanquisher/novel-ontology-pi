 .ok { color:var(--green) } .feed .warn { color:var(--amber) } .feed .jev { color:var(--violet) }\n  .gatebox { margin-top:9px; border:1px solid var(--amber); border-radius:9px; padding:7px 9px;\n    font-size:11.5px; color:var(--amber); opacity:0; transition:all .4s }\n  .gatebox.show { opacity:1 } .gatebox.merged { border-color:var(--green); color:var(--green) }\n  #uniChip { position:absolute; top:44px; right:12px; z-index:5; background:#171e2e; color:var(--dim);\n    border:1px solid var(--line); border-radius:99px; padding:5px 12px; font-size:12.5px;\n    display:flex; gap:7px; align-items:center; transition:all .4s }\n  #uniChip #uniBadge { background:#26304a; color:var(--dim); border-radius:99px; padding:0 7px;\n    font-size:11.5px; font-weight:700 }\n  #uniChip.shine { color:#0b0e14; background:var(--amber); border-color:var(--amber); font-weight:700;\n    animation:chipGlow 1s ease-in-out infinite }\n  #uniChip.shine #uniBadge { background:#0b0e14; color:var(--amber) }\n  #uniChip.caught { background:var(--green); border-color:var(--green); color:#0b0e14; font-weight:700; animation:none }\n  #uniChip.caught #uniBadge { background:#0b0e14; color:var(--green) }\n  @keyframes chipGlow { 0%,100% { box-shadow:0 0 4px rgba(251,191,36,.5) } 50% { box-shadow:0 0 22px rgba(251,191,36,.95) } }\n  .uniwrap { display:grid; grid-template-columns: 178px 1fr }\n  .rail { border-right:1px solid var(--line); padding:10px; display:flex; flex-direction:column; gap:7px }\n  .railfeed { margin-top:6px; font-size:11.5px }\n  .railfeed h4 { margin:0 0 7px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--faint) }\n  .railfeed ul { margin:0; padding:0 }\n  .railfeed li { list-style:none; margin:0 0 6px; color:var(--dim); opacity:0; transform:translateX(8px); transition:all .45s; line-height:1.45 }\n  .railfeed li.show { opacity:1; transform:none }\n  .railfeed .ok { color:var(--green) } .railfeed .warn { color:var(--amber) } .railfeed .jev { color:var(--violet) }\n  @media (max-width:760px){ .uniwrap{grid-template-columns:1fr} .rail{border:0} }\n  @media (max-width:760px){ .pgmain{grid-template-columns:1fr} .pipe,.feed{border:0} }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"kicker\">Phase D — Experience · Sector 13</div>\n<h1>Playground frontend — the live theater</h1>\n<p class=\"sub\">A standalone web app (React + <b>Reagraph</b>, chosen 2026-10-21) that makes the whole\nsystem <i>watchable</i>: as blocks roll through the miniloop, the ontology graph grows on screen in 3D —\ndecisions stream in, proposed changes glow as ghosts, merges land with a pulse. Transparency as a\nfeature: for the user's attention, and for our debugging. Host-agnostic by design — a VS Code webview\nwrapper can adopt the same component later.</p>\n\n<h2>The demo — one world, watched live</h2>\n<div class=\"demo\">\n  <div class=\"pg\" style=\"position:relative\">\n    <div class=\"pgbar\">\n      <span class=\"dot3\" style=\"background:#f87171\"></span><span class=\"dot3\" style=\"background:#fbbf24\"></span><span class=\"dot3\" style=\"background:#34d399\"></span>\n      <span id=\"uniCrumb\">playground · timeline — chapter range</span>\n      <span class=\"live\"><i></i>LIVE</span>\n    </div>\n    <div id=\"uniChip\">✦ Agent activity <span id=\"uniBadge\">0</span></div>\n    <div class=\"uniwrap\">\n      <div class=\"rail\">\n        <div class=\"blockchip\" id=\"blk\">▣ block b0011 · branch ch.2</div>\n        <div class=\"pstage\" id=\"ps0\"><b>Sectioning</b>deterministic · code</div>\n        <div class=\"pstage\" id=\"ps1\"><b>Miniloop patches</b>Jev decisions</div>\n        <div class=\"pstage\" id=\"ps2\"><b>Extraction</b>DeepSeek · per scene</div>\n        <div class=\"pstage\" id=\"ps3\"><b>ChangeSet</b>proposals accumulate</div>\n        <div class=\"pstage\" id=\"ps4\"><b>Merge gate</b>main agent reviews</div>\n        <div class=\"railfeed\">\n          <h4>Decision stream</h4>\n          <ul id=\"feedList\">\n            <li data-t=\"400\">▸ b0011 sectioned — 38 sentences</li>\n            <li data-t=\"1700\"><span class=\"jev\">jev</span> present · 黒子 .96</li>\n            <li data-t=\"3100\"><span class=\"jev\">jev</span> dialogue · 4 turns attributed</li>\n            <li data-t=\"4600\"><span class=\"warn\">cs_b0011</span> — 6 proposals (branch)</li>\n            <li data-t=\"13300\"><span class=\"warn\">⚖ cs_b0011 at the GATE</span></li>\n            <li data-t=\"18000\"><span class=\"ok\">approved → merged</span> · graph rebuilt</li>\n          </ul>\n          <div class=\"gatebox\" id=\"gateBox\">⧗ GATE · 6 proposals pending</div>\n        </div>\n      </div>\n      <div class=\"stage3d\">\n        <svg id=\"uniSvg\" viewBox=\"0 0 700 400\" preserveAspectRatio=\"xMidYMid meet\"></svg>\n      </div>\n    </div>\n  </div>\n  <div class=\"caption\" id=\"uniCap\">One world: the timeline at chapter range. Down in the branch lane, System 1 is already knitting — ghosts appearing in place.</div>\n</div>\n<p style=\"color:var(--dim);font-size:13.5px\">This single loop is the whole product idea. <b>One\nworld:</b> the ontology graph is the only source of truth; the timeline, the 3D interior and the\nlive feed are cameras over it, never separate data. <b>Two zoom levels:</b> chapter-range\n<i>big events</i> on the outside; click one and it opens into its <i>3D interior</i> — character,\nlocation, scene, dialogue and event nodes laid out in 3D roughly in chronological order, every link\nsingle-directional along an explicit time-flow axis. A story told in two places at once shows\n<b>two parallel chains</b> (here: the café and the street patrol, interleaved by one phone call).\n<b>Live, without fighting:</b> while you are inside, the agent keeps knitting in another lane —\nghosts appear there, in place, and the <b>activity tab</b> quietly shines. Tap it and a guided\nflight carries your camera out, across lanes, to the knitting site, arriving as the merge lands.</p>\n\n<h2>Design details</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><b>One graph, many cameras (core principle):</b> live activity and timeline browsing are the SAME surface. Views are cameras/filters over the single ontology graph (the source of truth) — never separate data. The agent's knitting renders in place wherever it belongs (any lane, any chapter, inside any big event) as ghosts, and never moves the user's camera. A follow-agent mode exists, but it is a toggle, off by default.</li>\n  <li><b>The shining activity tab:</b> agent/System-1 activity elsewhere accumulates as notifications with a location attached (lane, big event, zoom level). The tab glows when something noteworthy lands — new knitting site, a ChangeSet reaching the gate, a merge. Tapping an entry runs a <i>guided flight</i>: the camera travels across lanes and semantic zoom levels to the exact site, expanding containers on the way in. Notification policy is a design knob: merges and gate arrivals always shine; raw verdicts batch silently.</li>\n  <li><b>Stack:</b> Vite + React + TypeScript; <b>Reagraph</b> (Apache-2.0) for the graph stage — clustering, expand/collapse (chapter → scene → event zoom), node badges for pending proposals; a <b>React Flow</b> strip for the pipeline itself. Both views share selection state: click a block in the strip, the graph flies to what it produced.</li>\n  <li><b>Event feed is the contract:</b> the CLI emits a typed event stream (block started · sentence sectioned · patch verdict · proposal added · changeset pending · merged · graph rebuilt). The frontend is a pure consumer — first transport is the CLI writing an append-only <code>events.jsonl</code> per novel plus a tiny local SSE server (<code>novel watch</code>); the component never touches the DB directly.</li>\n  <li><b>Four views, one state:</b> <i>Live Theater</i> (this demo), <i>Ontology Explorer</i> (free 3D browse, search, focus), <i>Timeline Lanes</i> (canon + branches as lanes, scrub/play through event order — DIY over chronologicalOrder), <i>Gate Queue</i> (ChangeSets as cards with diff-style review, approve/hold from the UI).</li>\n  <li><b>Timeline zoom is semantic, two levels:</b> level 1 shows <i>big events</i> — summarized beats spanning chapter ranges; clicking one expands it into its <i>3D interior</i> (level 2): characters, locations, scenes, dialogue turns and micro-events laid out in 3D roughly in chronological order along a time-flow axis, single-directional links only. A story narrated in parallel places shows <i>parallel chains</i> — one per location — interleaved only where the narration actually crosses (a phone call, a meeting). Data-wise this is containment: a big event groups scenes/events; zoom = Reagraph expand/collapse over those relations, not a camera trick alone.</li>\n  <li><b>Ghosts before facts:</b> proposals render as translucent amber ghosts in the graph <i>before</i> approval and solidify on merge — the user literally sees the difference between what the miniloop believes and what is canon.</li>\n  <li><b>Replay for debugging:</b> the event stream is recorded, so any ingestion run can be replayed step-by-step later (the Agent Flow pattern) — a bug report becomes a rewatchable session.</li>\n  <li><b>Host-agnostic:</b> no filesystem or VS Code APIs inside the component. A later VS Code extension is a thin shell (webview + the same event feed); the standalone app remains the public face.</li>\n</ul>\n\n<h2>Implementation mapping</h2>\n<table>\n  <tr><th>Piece</th><th>Lands as</th></tr>\n  <tr><td>Playground app</td><td><code>apps/playground/</code> — Vite + React + TS, Reagraph + React Flow deps</td></tr>\n  <tr><td>Event emission</td><td>CLI: block processor + miniloop + changeset store emit <code>PlaygroundEvent</code> records (<code>src/events/</code>)</td></tr>\n  <tr><td>Live transport</td><td><code>novel watch &lt;novel-dir&gt;</code> — tails events.jsonl, serves SSE + the built frontend</td></tr>\n  <tr><td>Graph data</td><td>CLI query endpoints over LadybugStore/retrieval (initial snapshot + deltas)</td></tr>\n  <tr><td>Gate actions</td><td>UI calls the same changeset approve/hold path as the CLI — one gate, two doors</td></tr>\n</table>\n\n<h2>Open questions — this sector only</h2>\n<ul class=\"qlist\">\n    <li>Transport final form.<span>SSE from a local server (current plan) vs. WebSocket vs. plain file-tail polling — SSE is simplest and one-directional like the data; bidirectional needs (gate clicks) are ordinary HTTP posts. Confirm SSE?</span></li>\n    <li>Session recording format.<span>Events already persist as JSONL — how much UI state (camera, selections) joins the recording for faithful replay?</span></li>\n    <li>Scale guardrails.<span>Reagraph is comfortable in the low thousands of nodes; at whole-novel scale the explorer needs cluster-first rendering (chapters as supernodes) — the default view decision: always clustered, expand on demand?</span></li>\n    <li>2D fallback.<span>Reagraph offers 2D layouts in the same component — ship a 2D/3D toggle from day one for weaker GPUs?</span></li>\n    <li>Notification policy.<span>What earns a shine vs. a silent feed entry — merges and gate arrivals always; escalations (low-confidence, held ChangeSets) immediately? Multiple simultaneous knitting sites: one tab entry per site, or a single rolled-up \"3 sites active\"?</span></li>\n</ul>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · System 1 design · 13 Playground frontend</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  const links = [\n    `<a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a>`,\n    `<a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>`,\n    ...SECTORS.map(\n      (s) =>\n        `<a class=\"page ${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} ${s.label}</a>`,\n    ),\n  ].join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>System 1 · design by sector</small></a><div class=\"links\">${links}</div>`;\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\n(function () {\n  const svg = document.getElementById('uniSvg');\n  const NS = 'http://www.w3.org/2000/svg';\n  function el(tag, attrs, parent) {\n    const e = document.createElementNS(NS, tag);\n    for (const k in attrs) e.setAttribute(k, attrs[k]);\n    if (parent) parent.appendChild(e);\n    return e;\n  }\n  function txt(x, y, str, size, fill, parent, anchor) {\n    const t = el('text', { x, y, 'font-size': size, fill, 'text-anchor': anchor || 'middle',\n      'paint-order': 'stroke', onst micro = el('g', { opacity: 0 }, svg);\n  const COL = { char: '#a78bfa', loc: '#7dd3fc', scene: '#94a3b8', event: '#2dd4bf', dlg: '#fbbf24' };\n  const MN = [\n    // chain A — café\n    ['cafe', '咖啡店', 'loc', -238, -2, -26, ''],\n    ['sceneA', '场景·柜台', 'scene', -192, -60, -12, ''],\n    ['uiharu', '初春饰利', 'char', -150, -132, 2, ''],\n    ['dlgA1', '对话①', 'dlg', -108, -60, 10, '「终端好像落在店里了…」'],\n    ['evA1', '发现终端', 'event', -18, -60, -16, ''],\n    ['mikoto', '御坂美琴', 'char', 28, -134, 8, ''],\n    ['dlgA2', '对话②', 'dlg', 78, -60, 12, '「店员捡到一台，是这个？」'],\n    ['evA2', '确认归属', 'event', 196, -60, -8, ''],\n    // chain B — street\n    ['street', '街道', 'loc', -228, 118, 16, ''],\n    ['sceneB', '场景·巡逻', 'scene', -172, 60, 26, ''],\n    ['kuroko', '白井黒子', 'char', -118, -6, 32, ''],\n    ['dlgB1', '对话③', 'dlg', -58, 60, 40, '「姐姐大人，我这边还没找到」'],\n    ['evB1', '街道巡查', 'event', 122, 60, 18, ''],\n  ];\n  const ME = [\n    ['cafe', 'sceneA', 'thin'], ['sceneA', 'dlgA1', 'flow'], ['dlgA1', 'evA1', 'flow'],\n    ['evA1', 'dlgA2', 'flow'], ['dlgA2', 'evA2', 'flow'],\n    ['street', 'sceneB', 'thin'], ['sceneB', 'dlgB1', 'flow'], ['dlgB1', 'evB1', 'flow'],\n    ['uiharu', 'dlgA1', 'thin'], ['dlgA1', 'mikoto', 'thin'], ['mikoto', 'dlgA2', 'thin'],\n    ['kuroko', 'dlgB1', 'thin'], ['dlgB1', 'mikoto', 'dash'],\n  ];\n  const mNodes = {}, mEdges = [];\n  const gME = el('g', {}, micro), gMN = el('g', {}, micro);\n  for (const [a, b, type] of ME) {\n    const l = el('line', { stroke: type === 'flow' ? '#2dd4bf' : type === 'dash' ? '#a78bfa' : '#5f6d88',\n      'stroke-width': type === 'flow' ? 2 : 1.2, 'stroke-dasharray': type === 'dash' ? '4 3' : 'none',\n      'marker-end': type === 'flow' ? 'url(#arrT)' : type === 'dash' ? 'url(#arrV)' : 'url(#arr)', opacity: 0 }, gME);\n    mEdges.push({ a, b, type, l });\n  }\n  for (const [id, label, kind, x, y, z, quote] of MN) {\n    const g = el('g', {}, gMN);\n    const c = el('circle', { fill: COL[kind], stroke: '#0a0e16', 'stroke-width': h.pow(-2 * k + 2, 2) / 2;\n  const F = 340, CX = 350, CY = 200;\n  const LOOP = 22000;\n  let start = performance.now();\n  function frame(now) {\n    const t = (now - start) % LOOP;\n    /* ---- phases ---- */\n    // zoom into C3: 4.7–6.5 ; micro until 14.8 ; flight: 14.8–17.8 ; arrival hold →19.9 ; release 19.9–21.4\n    let zIn = 0, zFly = 0;\n    if (t >= 4700 && t < 6500) zIn = ease((t - 4700) / 1800);\n    else if (t >= 6500 && t < 14800) zIn = 1;\n    else if (t >= 14800 && t < 16400) zIn = 1 - ease((t - 14800) / 1600);\n    if (t >= 14800 && t < 17800) zFly = ease((t - 14800) / 3000);\n    else if (t >= 17800 && t < 19900) zFly = 1;\n    else if (t >= 19900) zFly = 1 - ease((t - 19900) / 1500);\n    const microO = Math.max(0, (zIn - 0.45) / 0.55) * (t < 15200 ? 1 : Math.max(0, 1 - (t - 15200) / 700));\n    // macro transform: zoom to C3 during zIn, then focus glides C3 -> W2 with zFly\n    const fx = 400 + (420 - 400) * zFly, fy = 122 + (302 - 122) * zFly;\n    const sMac = 1 + 1.7 * zIn * (1 - zFly) + 0.8 * zFly;\n    macro.setAttribute('transform', `translate(350 200) scale(${sMac}) translate(${-fx} ${-fy})`);\n    let macO = 1 - Math.max(0, (zIn - 0.55) / 0.45);\n    if (t >= 14800) macO = Math.min(1, (t - 14800) / 900);\n    macro.setAttribute('opacity', String(Math.max(0, Math.min(1, macO))));\n    micro.setAttribute('opacity', String(microO));\n    focus.setAttribute('opacity', String(0.8 * (1 - zIn)));\n    arrive.setAttribute('opacity', String(zFly > 0.9 && t < 19900 ? 1 : 0));\n    crumb.textContent = microO > 0.5\n      ? 'playground · 第二章 › 大事件「归还终端」› 3D interior'\n      : (zFly > 0.5 ? 'playground · guided flight → branch knitting site' : 'playground · timeline — chapter range');\n    /* ---- knitting: ghosts, halo, chip ---- */\n    const spawnTimes = [1100, 2100, 3100, 4000];\n    let gcount = 0;\n    ghostEls.forEach((c, i) => {\n      const born = t >= spawnTimes[i] && t < 21400;\n      if (born) gcount++;\n      const solid = t >= 18000 && t < 21400;\n      c.setAttribute('opacity', born ? (solid ? 0.95 : 0.55) : 0);\n      c.setAttribute('fill', solid ? '#a78bfa' : '#fbbf24');\n      c.setAttribute('stroke-dasharray', solid ? 'none' : '3 2');\n    });\n    const hp = (t % 1400) / 1400;\n    halo.setAttribute('r', 28 + hp * 15);\n    halo.setAttribute('opacity', t >= 1100 && t < 18000 ? String(0.7 * (1 - hp)) : 0);\n    const caught = t >= 18000 && t < 21400;\n    chip.className = caught ? 'caught' : (gcount > 0 ? 'shine' : '');\n    chip.childNodes[0].textContent = caught ? '✓ Caught up ' : (t >= 13300 && t < 14800 ? '⚖ Gate + Agent activity ' : '✦ Agent activity ');\n    badge.textContent = caught ? '0' : String(gcount);\n    const rt = (t - 18000) / 1000;\n    if (rt >= 0 && rt <= 1) { ripple.setAttribute('r', 12 + rt * 44); ripple.setAttribute('opacity', String(0.85 * (1 - rt))); }\n    else ripple.setAttribute('opacity', 0);\n    /* ---- rail: pipeline, feed, gate ---- */\n    const stage = t < 1300 ? 0 : t < 3500 ? 1 : t < 4400 ? 2 : t < 5600 ? 3 : t < 13300 ? 4 : 5;\n    for (let i = 0; i < 5; i++) {\n      const e2 = document.getElementById('ps' + i);\n      e2.className = 'pstage' + (i < stage || stage === 5 ? ' done' : i === stage ? ' on' : '');\n    }\n    document.getElementById('blk').className = 'blockchip' + (t > 250 ? ' show' : '');\n    document.querySelectorAll('#feedList li').forEach(li => li.classList.toggle('show', t >= +li.dataset.t && t < 21400));\n    const gate = document.getElementById('gateBox');\n    gate.className = 'gatebox' + (t >= 4600 && t < 21400 ? ' show' : '') + (caught ? ' merged' : '');\n    gate.textContent = caught ? '✓ GATE · cs_b0011 merged' : '⧗ GATE · 6 proposals pending';\n    /* ---- micro 3D render ---- */\n    if (microO > 0.01) {\n      const mt = Math.max(0, t - 6500);\n      const ang = Math.sin(now * 0.00022) * 0.17;\n      const pos = {};\n      const ordered = Object.values(mNodes).slice();\n      for (const n of ordered) {\n        const xr = n.x * Math.cos(ang) - n.z * Math.sin(ang);\n        const zr = n.x * Math.sin(ang) + n.z * Math.cos(ang);\n        const s = F / (F + zr);\n        pos[n.id] = { px: CX + xr * s, py: CY + n.y * s, s, zr };\n      }\n      // time axis in 3D\n      const ax = [-272, 272].map(x => {\n        const xr = x * Math.cos(ang), zr = x * Math.sin(ang), s = F / (F + zr);\n        return { px: CX + xr * s, py: CY + 158 * s, s };\n      });\n      axisL.setAttribute('x1', ax[0].px); axisL.setAttribute('y1', ax[0].py);\n      axisL.setAttribute('x2', ax[1].px); axisL.setAttribute('y2', ax[1].py);\n      for (const cv of chevs) {\n        const xr = cv.x * Math.cos(ang), zr = cv.x * Math.sin(ang), s = F / (F + zr);\n        cv.c.setAttribute('x', CX + xr * s); cv.c.setAttribute('y', CY + 152 * s);\n      }\n      axisLabel.setAttribute('x', ax[1].px); axisLabel.setAttribute('y', ax[1].py + 22);\n      // progressive reveal of the time-flow chain edges\n      const flowIdx = { 'sceneA>dlgA1': 0, 'dlgA1>evA1': 1, 'evA1>dlgA2': 2, 'dlgA2>evA2': 3, 'sceneB>dlgB1': 0.5, 'dlgB1>evB1': 2.5 };\n      for (const e of mEdges) {\n        const a = pos[e.a], b = pos[e.b];\n        let vis = 1;\n        if (e.type === 'flow') vis = mt > 500 + (flowIdx[e.a + '>' + e.b] || 0) * 620 ? 1 : 0;\n        e.l.setAttribute('x1', a.px); e.l.setAttribute('y1', a.py);\n        e.l.setAttribute('x2', b.px); e.l.setAttribute('y2', b.py);\n        e.l.setAttribute('opacity', String(vis * (e.type === 'flow' ? 0.9 : e.type === 'dash' ? 0.55 : 0.4)));\n      }\n      // active dialogue turn cycles\n      const dlgIds = ['dlgA1', 'dlgB1', 'dlgA2'];\n      const activeDlg = dlgIds[Math.floor(mt / 1200) % 3];\n      for (const n of ordered) {\n        const p = pos[n.id];\n        const r = (n.kind === 'char' ? 12 : n.kind === 'loc' ? 11 : n.kind === 'dlg' ? 9 : 10) * p.s;\n        n.c.setAttribute('cx', p.px); n.c.setAttribute('cy', p.py); n.c.setAttribute('r', r);\n        n.c.setAttribute('stroke', n.id === activeDlg ? '#fbbf24' : '#0a0e16');\n        n.c.setAttribute('stroke-width', n.id === activeDlg ? 3 : 1.5);\n        n.t.setAttribute('x', p.px); n.t.setAttribute('y', p.py + r + 13);\n        n.t.setAttribute('opacity', p.s > 0.8 ? 1 : 0.25);\n        if (n.q) {\n          n.q.setAttribute('x', p.px); n.q.setAttribute('y', p.py - r - 8);\n          n.q.setAttribute('opacity', n.id === activeDlg ? 1 : 0);\n        }\n      }\n    }\n    let capText = CAPS[0][1];\n    for (const [ct, tx] of CAPS) if (t >= ct) capText = tx;\n    if (cap.textContent !== capText) cap.textContent = capText;\n    requestAnimationFrame(frame);\n  }\n  requestAnimationFrame(frame);\n})();\n\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","sectioning.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>01 Sectioning — novel-ontology-pi design</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:thin}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"sectorno\">01</div>\n<div class=\"kicker\">sector 01 · phase A — structure</div>\n<h1>Sectioning — intake &amp; auto sentence segregation</h1>\n<p>\n  <span class=\"badge v1\">status: implemented</span>\n  <span class=\"badge\">repo: <code>src/text/sectioning.ts</code></span>\n  <span class=\"badge\">model: none — deterministic code</span>\n</p>\n<p class=\"sub\">The front door of the whole system. A novel arrives as one big text; this sector cuts it\ninto <b>blocks</b> (a chapter, or a long block) and segregates each block into <b>sentences</b> with\nstable IDs and character offsets. Every later decision, scene, event and proposal cites these IDs —\nsectioning is the provenance anchor for the entire ontology.</p>\n\n<table class=\"io\">\n  <tr><th>Inputs</th><td>Raw novel file (EPUB / TXT), in any language</td></tr>\n  <tr><th>Outputs</th><td>Blocks → sentences: <code>{ id, index, paragraphIndex, text, startOffset, endOffset }</code></td></tr>\n  <tr><th>Depends on</th><td>Nothing — first sector in the pipeline</td></tr>\n  <tr><th>Feeds into</th><td>Every patch (02–06), the miniloop engine (07), extraction (08)</td></tr>\n</table>\n\n<h2>Demo — a block segregates itself</h2>\n<div class=\"panel\">\n  <div class=\"caption\" id=\"caption\"><span class=\"stepno\">▶</span>The demo plays and loops on its own.</div>\n  <div class=\"progressdots\" id=\"dots\"></div>\n  <div class=\"stage\">\n    <div id=\"rawblock\" style=\"font-size:14px;color:var(--dim);opacity:.3;transition:opacity .5s\">\n      御坂美琴推开咖啡店的门，环顾四周。「姐姐大人，您迟到了十分钟。」白井黑子坐在窗边，晃了晃手中的杯子。「初春说她马上就到。」话音未落，初春饰利推门进来。「抱歉，我来晚了！」美琴想起黑子早上提到的风纪委员巡逻。</div>\n    <div class=\"items\" id=\"sentitems\"></div>\n    <div id=\"sumrow\" style=\"margin-top:8px\"></div>\n  </div>\n  <p style=\"margin-top:12px\"><button class=\"replay\" id=\"replay\">↻ Replay</button></p>\n</div>\n\n<h2>Design details</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><b>Rule zero lives here:</b> never ask a model what code can compute exactly. Splitting text is exactly computable, so no model — Jev or LLM — is ever consulted in this sector.</li>\n  <li><b>Language-aware rules:</b> CJK terminal punctuation (。！？) and quote nesting (「」『』) close sentences; ellipses (……) don't split mid-thought; English abbreviations (Dr., e.g.) and decimals (3.5) don't split either.</li>\n  <li><b>Stable IDs:</b> <code>b0007_s0003</code> = block 7, sentence 3. IDs never change after assignment, so a ChangeSet proposal can cite a sentence forever.</li>\n  <li><b>Offsets are evidence:</b> every sentence knows its exact character range in the source block, so any ontology node can be traced back to the literal text that produced it.</li>\n  <li><b>Blocks are the processing unit:</b> ingestion rolls block by block (see sector 09); a block is one chapter when chapters exist, otherwise a long slice of text.</li>\n</ul>\n\n<h2>Implementation</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><code>src/text/sectioning.ts</code> — <code>sectionBlock(text, blockIndex)</code>; paragraph split first, then terminator scan with a closer-absorption run (。』 ?! etc.).</li>\n  <li>Exposed as <code>novel section &lt;file&gt;</code> — works today, prints JSON.</li>\n  <li>Tests: <code>test/sectioning.test.ts</code> — CJK quotes, English abbreviations/decimals, paragraph tracking. All passing.</li>\n</ul>\n\n<h2>Open questions — sectioning</h2>\n<div class=\"panel\">\n  <ul class=\"tight oq\" style=\"font-size:14px\">\n    <li>Block cutting.<span>How are chapters detected across EPUB structures and raw TXT conventions (第X章 headings, TOC entries, volume splits)? When a book has no chapters, how long is a \"long block\", and should blocks overlap by a few sentences for context?</span></li>\n    <li>More languages' rules.<span>European quotes («» „ \"), Korean spacing, Japanese vertical-text artifacts — which languages get hand-tuned rules in v1, and which fall back to a generic splitter?</span></li>\n    <li>Non-narrative matter.<span>Author notes, afterwords, illustrations' captions, tables — sectioned like prose, flagged, or skipped?</span></li>\n    <li>Damaged text.<span>OCR errors and missing punctuation in fan-translated files — how much fuzz should the splitter tolerate before a block is flagged for the merge gate?</span></li>\n  </ul>\n</div>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · design by sector · v0.1 · 2026-10-21</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  const links = [\n    `<a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a>`,\n    `<a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>`,\n    ...SECTORS.map(\n      (s) =>\n        `<a class=\"page ${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} ${s.label}</a>`,\n    ),\n  ].join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>System 1 · design by sector</small></a><div class=\"links\">${links}</div>`;\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\nconst SENTS=[\"御坂美琴推开咖啡店的门，环顾四周。\",\"「姐姐大人，您迟到了十分钟。」\",\"白井黑子坐在窗边，晃了晃手中的杯子。\",\"「初春说她马上就到。」\",\"话音未落，初春饰利推门进来。\",\"「抱歉，我来晚了！」\",\"美琴想起黑子早上提到的风纪委员巡逻。\"];\nconst box=document.getElementById('sentitems');\nbox.innerHTML=SENTS.map((t,i)=>`<div class=\"item\" id=\"si${i}\"><small>b0007_s000${i} · offset ${i*14}–${i*14+13}</small>${t}</div>`).join('');\nconst steps=[\n {t:2000,cap:[\"A block arrives as raw text\",\"One chapter, unpunctuated by structure — a single string. Nothing downstream can cite anything yet.\"],run(){document.getElementById('rawblock').style.opacity=1;}},\n {t:2600,cap:[\"Segregation: terminators + quote closers\",\"The splitter scans for terminal punctuation, absorbing closing quotes (。」) into the sentence they end. Seven sentences appear — each with its ID.\"],run(){SENTS.forEach((_,i)=>document.getElementById('si'+i).classList.add('on'));}},\n {t:2400,cap:[\"IDs + offsets are stamped\",\"Every sentence now carries a stable ID and its exact character range. This is the last time this sector runs — and the first thing every other sector reads.\"],run(){document.getElementById('sumrow').innerHTML='<span class=\"chip\">7 sentences</span> <span class=\"chip\">1 block</span> <span class=\"chip\">0 model calls</span> <span class=\"chip\">provenance: ready</span>';}},\n];\nrunSectorDemo(steps.map(s=>({...s,reset(){document.getElementById('rawblock').style.opacity=.3;SENTS.forEach((_,i)=>document.getElementById('si'+i).classList.remove('on'));document.getElementById('sumrow').innerHTML='';}})));\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","scene-boundary.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>02 Scene boundary — novel-ontology-pi design</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharray:5 4}\n.arch .title{fill:#e8ecf4;font-size:14px;font-weight:700}\n.arch .small{fill:#9aa7bd;font-size:11px}\n.arch .zone{fill:none;stroke:#26304a;stroke-dasharray:7 6;rx:16}\n.arch .zonelabel{fill:#5f6d88;font-size:11px;letter-spacing:.18em}\n.arch .edge{stroke:#3d4a6b;stroke-width:1.6;fill:none;marker-end:url(#arr)}\n.arch .edge.hot{stroke:var(--teal)}\n.arch .edge.jev{stroke:var(--violet)}\n.arch .edge.llm{stroke:#818cf8}\n.arch .elabel{fill:#9aa7bd;font-size:10.5px}\n.arch .flowdash{stroke-dasharray:6 6;animation:dash 1.4s linear infinite}\n@keyframes dash{to{stroke-dashoffset:-24}}\n.arch .pulse{fill:var(--teal)}\n\n/* ---------- live demo ---------- */\n.demo-stage{min-height:340px}\n.caption{font-size:14px;color:var(--ink);min-height:42px}\n.caption .stepno{color:var(--teal);font-weight:700;margin-right:8px}\n.caption .why{color:var(--dim);display:block;font-size:13px}\n.sentrow{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}\n.sent{border:1px solid var(--line);background:#0d1220;border-radius:10px;\n  padding:8px 10px;font-size:13.5px;max-width:300px;opacity:.28;transition:all .5s}\n.sent .sid{font-family:ui-monospace,monospace;font-size:10.5px;color:var(--faint);display:block}\n.sent .gloss{color:var(--faint);font-size:11.5px;display:block}\n.sent.on{opacity:1}\n.sent.dialogue{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.sent.stitched{border-color:var(--violet);box-shadow:0 0 0 1px var(--violet) inset}\n.sent.boundary{border-left:4px solid var(--amber)}\n.sent mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px;transition:all .4s}\n.sent mark.known{background:rgba(45,212,191,.28)}\n.sent mark.newname{background:rgba(251,191,36,.30)}\n.tag{display:none;font-size:10.5px;border-radius:99px;padding:1px 8px;margin-left:6px;vertical-align:middle}\n.tag.show{display:inline-block}\n.tag.speaker{background:#232a4a;color:var(--indigo);border:1px solid var(--indigo)}\n.tag.present{background:#0f2e28;color:var(--teal);border:1px solid var(--teal)}\n.tag.mentioned{background:#241a10;color:var(--amber);border:1px solid var(--amber)}\n.splitcols{display:none;gap:12px;margin-top:10px}\n.splitcols.show{display:flex;flex-wrap:wrap}\n.splitcol{flex:1;min-width:200px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.splitcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.chip{display:inline-block;border:1px solid var(--line);border-radius:99px;\n  padding:2px 10px;font-size:12.5px;margin:2px}\n.chip.new{border-color:var(--amber);color:var(--amber)}\n.progressdots{display:flex;gap:6px;margin:12px 0 4px}\n.progressdots i{width:26px;height:4px;border-radius:2px;background:var(--line)}\n.progressdots i.done{background:var(--teal)}\n.csbar{display:none;margin-top:12px;border:1px solid var(--line);border-radius:10px;padding:10px 12px}\n.csbar.show{display:block}\n.csbar .fill{height:8px;border-radius:4px;background:linear-gradient(90deg,var(--teal),var(--indigo));\n  width:0;transition:width 1s}\nbutton.replay{background:var(--panel2);color:var(--ink);border:1px solid var(--teal);\n  border-radius:8px;padding:6px 16px;cursor:pointer;font-size:13px}\nbutton.replay:hover{background:#1d2740}\n\n/* ---------- gates ---------- */\n.gatebar{position:relative;height:34px;border-radius:8px;margin:26px 0 70px;\n  background:linear-gradient(90deg,var(--rose) 0 55%,var(--amber) 55% 85%,var(--green) 85% 100%)}\n.gatebar .lbl{position:absolute;top:38px;font-size:12px;color:var(--dim);transform:translateX(-50%);width:300px;text-align:center}\n.gatebar .marker{position:absolute;top:-8px;width:3px;height:48px;background:var(--ink);\n  animation:scan 5s ease-in-out infinite}\n@keyframes scan{0%,100%{left:8%}50%{left:93%}}\n\n/* ---------- merge gate ---------- */\n.gate-flow{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}\n.outcome{flex:1;min-width:200px;border-radius:12px;padding:14px 16px;border:1px solid var(--line);\n  background:var(--panel2);opacity:.35;transition:all .5s}\n.outcome.lit{opacity:1}\n.outcome.approve.lit{border-color:var(--green);box-shadow:0 0 18px rgba(74,222,128,.15)}\n.outcome.hold.lit{border-color:var(--amber);box-shadow:0 0 18px rgba(251,191,36,.15)}\n.outcome.revise.lit{border-color:var(--rose);box-shadow:0 0 18px rgba(251,113,133,.15)}\n.stamp{display:inline-block;border:2px solid currentColor;border-radius:6px;\n  padding:1px 8px;font-weight:700;letter-spacing:.1em;font-size:12px;transform:rotate(-4deg)}\n.novel-progress{height:10px;background:#0d1220;border:1px solid var(--line);border-radius:6px;overflow:hidden}\n.novel-progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--green));\n  transition:width 1.2s}\n.oq li{margin:9px 0;color:var(--ink)}\n.oq li span{color:var(--dim);display:block;font-size:13px}\n\n/* ---------- sector pages: shared template ---------- */\nnav.site .links{display:flex;gap:6px;overflow-x:auto;flex-wrap:nowrap;padding-bottom:4px;scrollbar-width:thin}\nnav.site .links a.page{white-space:nowrap}\n.sectorno{font-size:44px;font-weight:800;color:var(--panel2);-webkit-text-stroke:1px var(--teal);\n  line-height:1;float:right;margin-left:14px}\ntable.io{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.io td,table.io th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.io th{color:var(--dim);font-weight:600;width:130px;background:var(--panel2)}\n.stage{background:#0d1220;border:1px solid var(--line);border-radius:12px;padding:16px;min-height:210px;position:relative;overflow:hidden}\n.items{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}\n.item{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:7px 11px;\n  font-size:13px;opacity:.25;transition:all .45s;max-width:330px}\n.item.on{opacity:1}\n.item small{display:block;color:var(--faint);font-size:11px;font-family:ui-monospace,monospace}\n.item.dlg{border-color:var(--indigo);box-shadow:0 0 0 1px var(--indigo) inset}\n.item.narr{border-color:#3d4a6b}\n.item.thought{border-color:var(--violet)}\n.item.desc{border-color:#54617f}\n.item.boundary{border-left:4px solid var(--amber)}\n.item mark{background:transparent;color:inherit;border-radius:4px;padding:0 2px}\n.item mark.known{background:rgba(45,212,191,.28)}\n.item mark.cand{background:rgba(251,191,36,.30)}\n.outcol{flex:1;min-width:190px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px}\n.outcol h4{margin:0 0 6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}\n.meter{height:8px;background:#131a29;border-radius:4px;overflow:hidden;margin:4px 0 2px}\n.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--amber),var(--teal));transition:width .8s}\n.qcard{border:1px solid var(--line);border-left:3px solid var(--violet);border-radius:8px;\n  padding:8px 12px;margin:6px 0;background:var(--panel2);font-size:13px}\n.qcard b{color:var(--violet)}\n.verdict{border-radius:8px;padding:8px 12px;font-size:13px;margin:6px 0;border:1px solid var(--line);opacity:.25;transition:all .4s}\n.verdict.on{opacity:1}\n.verdict.good{border-color:var(--green)} .verdict.warn{border-color:var(--amber)} .verdict.bad{border-color:var(--rose)}\n.winframe{position:absolute;border:2px solid var(--teal);border-radius:10px;pointer-events:none;\n  transition:all .8s ease;box-shadow:0 0 0 9999px rgba(4,6,10,.45)}\n.tlwrap{position:relative;margin:26px 6px 8px}\n.tlline{position:absolute;left:0;right:0;top:9px;height:3px;background:#3d4a6b;border-radius:2px}\n.tlbranch{position:absolute;left:0;top:9px;height:3px;background:var(--teal);border-radius:2px;width:0;transition:width 1.2s}\n.tldot{position:absolute;top:3px;width:15px;height:15px;border-radius:50%;background:var(--panel2);\n  border:2px solid var(--faint);transform:translateX(-50%);transition:all .4s}\n.tldot.hit{border-color:var(--teal);background:var(--teal)}\n.tldot.fork{border-color:var(--amber);background:var(--amber);box-shadow:0 0 12px rgba(251,191,36,.6)}\n.tllabel{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--dim);white-space:nowrap;text-align:center}\n.chatline{max-width:75%;border-radius:12px;padding:8px 12px;margin:7px 0;font-size:13.5px;opacity:.2;transition:all .5s}\n.chatline.on{opacity:1}\n.chatline.char{background:#14312b;border:1px solid var(--teal);margin-right:auto}\n.chatline.user{background:#232a4a;border:1px solid var(--indigo);margin-left:auto}\n.statebar{height:7px;background:#131a29;border-radius:4px;overflow:hidden}\n.statebar i{display:block;height:100%;background:var(--violet);width:20%;transition:width 1s}\n\n/* ---------- roadmap ---------- */\n.rtl{position:relative;margin:18px 0 6px;padding-left:26px}\n.rtl::before{content:\"\";position:absolute;left:8px;top:6px;bottom:6px;width:3px;border-radius:2px;\n  background:linear-gradient(180deg,var(--green) 0 12%,var(--teal) 12% 20%,#26304a 20% 100%)}\n.rphase{position:relative;margin:0 0 16px;background:var(--panel);border:1px solid var(--line);\n  border-radius:14px;padding:14px 18px}\n.rphase::before{content:\"\";position:absolute;left:-24px;top:20px;width:13px;height:13px;border-radius:50%;\n  background:var(--panel2);border:3px solid var(--faint)}\n.rphase.done::before{border-color:var(--green);background:var(--green)}\n.rphase.now{border-color:var(--teal)}\n.rphase.now::before{border-color:var(--teal);background:var(--teal);animation:pulse 1.8s ease-in-out infinite}\n@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(45,212,191,.5)}50%{box-shadow:0 0 0 7px rgba(45,212,191,0)}}\n.rphase h3{font-size:16.5px}\n.rphase .mile{color:var(--teal);font-size:13.5px}\n.rphase ul{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\n.rphase li{margin:3px 0}\n.status{font-size:11px;padding:2px 9px;border-radius:99px;border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.status.done{color:var(--green);border-color:var(--green)}\n.status.now{color:var(--teal);border-color:var(--teal)}\n.status.plan{color:var(--faint)}\ntable.dec{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}\ntable.dec td,table.dec th{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}\ntable.dec th{color:var(--dim);background:var(--panel2);font-weight:600}\n\n#sitenav, #pager { display: none !important; } body { padding-top: 4px; }\n</style>\n</head>\n<body>\n<div class=\"wrap\">\n<nav class=\"site\" id=\"sitenav\"></nav>\n\n<div class=\"sectorno\">02</div>\n<div class=\"kicker\">sector 02 · phase A — structure · decision patch</div>\n<h1>Scene boundary — where scenes start</h1>\n<p>\n  <span class=\"badge v1\">status: v1 patch (skeleton)</span>\n  <span class=\"badge\">repo: <code>src/autostep/patches/scene-boundary.ts</code></span>\n  <span class=\"badge\">model: Jev · <span class=\"prim noul\">noul</span></span>\n</p>\n<p class=\"sub\">Scenes are the unit everything else keys off: presence is per-scene, dialogue groups\ninside scenes, and extraction reads one scene at a time. This patch decides, sentence by sentence,\nwhether a new scene begins — and records <i>why</i>.</p>\n\n<table class=\"io\">\n  <tr><th>Inputs</th><td>Sentences of one window (IDs + text) + compact state: current scene-so-far</td></tr>\n  <tr><th>Outputs</th><td>Scene spans — ordered sentence-ID ranges, into shared context for patches 03–06 and extraction</td></tr>\n  <tr><th>Depends on</th><td>01 Sectioning</td></tr>\n  <tr><th>Feeds into</th><td>03 Dialogue, 05 Presence, 08 Extraction (per-scene unit)</td></tr>\n</table>\n\n<h2>Demo — scanning for the seam</h2>\n<div class=\"panel\">\n  <div class=\"caption\" id=\"caption\"><span class=\"stepno\">▶</span>The demo plays and loops on its own.</div>\n  <div class=\"progressdots\" id=\"dots\"></div>\n  <div class=\"stage\">\n    <div class=\"items\" id=\"items\"></div>\n    <div class=\"items\" id=\"spans\"></div>\n  </div>\n  <p style=\"margin-top:12px\"><button class=\"replay\" id=\"replay\">↻ Replay</button></p>\n</div>\n\n<h2>Decision questions</h2>\n<div class=\"qcard\"><b>is_scene_boundary</b> · <span class=\"prim noul\">noul</span> — Does a new scene begin at this sentence (change of place, a time skip, or a viewpoint shift from what came immediately before)? Asked per sentence; ≥ 0.5 opens a new span.</div>\n<div class=\"qcard\"><b>boundary_reason</b> · <span class=\"prim choice\">choice</span> <span class=\"badge cand\">candidate</span> — location_changed / time_skipped / pov_changed / cast_changed. Knowing <i>why</i> a boundary fired helps presence decide carryover.</div>\n\n<h2>Design details</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><b>First patch in the registry</b> — its spans frame every later patch's work in the window.</li>\n  <li><b>A boundary is a probability, not a cut:</b> near-0.5 answers are exactly what the engine's re-ask gate (sector 07) exists for — expand context and decide again.</li>\n  <li><b>Spans, not copies:</b> a scene is a list of sentence IDs; the text stays in the block, referenced.</li>\n</ul>\n\n<h2>Implementation</h2>\n<ul class=\"tight\" style=\"font-size:14px\">\n  <li><code>src/autostep/patches/scene-boundary.ts</code> — builds one <code>noul</code> per window sentence; applies spans into <code>ctx.accepted.sceneSpans</code>.</li>\n  <li>Gates: accept ≥ 0.85 · re-ask 0.55–0.85 · escalate &lt; 0.55 (tuning: see Open questions).</li>\n</ul>\n\n<h2>Open questions — scene boundaries</h2>\n<div class=\"panel\">\n  <ul class=\"tight oq\" style=\"font-size:14px\">\n    <li>Granularity.<span>Is a flashback inside a conversation a new scene, or a marked sub-span? Same question for dreams and回忆 interludes.</span></li>\n    <li>Soft boundaries.<span>Same room, same cast, but an hour passes — one scene or two? The answer changes how presence carryover works (sector 05).</span></li>\n    <li>Reason taxonomy.<span>Is {location, time, POV, cast} the right reason set — and does extraction actually consume the reason, or is it decoration?</span></li>\n    <li>Length caps.<span>Extraction reads per scene; is there a max scene size beyond which a \"soft split\" is forced for context limits?</span></li>\n  </ul>\n</div>\n\n<div class=\"pager\" id=\"pager\"></div>\n<footer>novel-ontology-pi · design by sector · v0.1 · 2026-10-21</footer>\n</div>\n<script>\n/* Shared site machinery for the System 1 design pages.\n   One nav definition -> every page carries the identical structure.\n   One demo sequencer -> every sector page runs its demo the same way:\n   caption + progress dots + steps + replay. */\nconst SECTORS = [\n  { n: \"01\", slug: \"sectioning\", label: \"Sectioning\" },\n  { n: \"02\", slug: \"scene-boundary\", label: \"Scene boundary\" },\n  { n: \"03\", slug: \"dialogue-detector\", label: \"Dialogue\" },\n  { n: \"04\", slug: \"name-detector\", label: \"Names\" },\n  { n: \"05\", slug: \"presence-detector\", label: \"Presence\" },\n  { n: \"06\", slug: \"speaker-attribution\", label: \"Speakers\" },\n  { n: \"07\", slug: \"miniloop-engine\", label: \"Miniloop engine\" },\n  { n: \"08\", slug: \"extraction\", label: \"Extraction\" },\n  { n: \"09\", slug: \"merge-gate\", label: \"Merge gate\" },\n  { n: \"10\", slug: \"storage-connectors\", label: \"Storage\" },\n  { n: \"11\", slug: \"timeline-forking\", label: \"Timelines & forks\" },\n  { n: \"12\", slug: \"simulation\", label: \"Simulation\" },\n  { n: \"13\", slug: \"playground-frontend\", label: \"Playground frontend\" },\n];\n\nfunction renderNav() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const nav = document.getElementById(\"sitenav\");\n  if (!nav) return;\n  const links = [\n    `<a class=\"page ${here === \"index.html\" ? \"here\" : \"\"}\" href=\"index.html\">Overview</a>`,\n    `<a class=\"page ${here === \"roadmap.html\" ? \"here\" : \"\"}\" href=\"roadmap.html\">🗺 Roadmap</a>`,\n    ...SECTORS.map(\n      (s) =>\n        `<a class=\"page ${here === s.slug + \".html\" ? \"here\" : \"\"}\" href=\"${s.slug}.html\">${s.n} ${s.label}</a>`,\n    ),\n  ].join(\"\");\n  nav.innerHTML = `<a class=\"brand\" href=\"index.html\">novel-ontology-pi<small>System 1 · design by sector</small></a><div class=\"links\">${links}</div>`;\n}\n\nfunction renderPager() {\n  const here = location.pathname.split(\"/\").pop() || \"index.html\";\n  const el = document.getElementById(\"pager\");\n  if (!el) return;\n  const order = [\"index.html\", \"roadmap.html\", ...SECTORS.map((s) => s.slug + \".html\")];\n  const names = {\n    \"index.html\": \"Overview\",\n    \"roadmap.html\": \"Roadmap\",\n    ...Object.fromEntries(SECTORS.map((s) => [s.slug + \".html\", `${s.n} ${s.label}`])),\n  };\n  const i = order.indexOf(here);\n  const prev = i > 0 ? order[i - 1] : null;\n  const next = i >= 0 && i < order.length - 1 ? order[i + 1] : null;\n  el.innerHTML =\n    (prev ? `<a href=\"${prev}\">← ${names[prev]}</a>` : \"<span></span>\") +\n    (next ? `<a href=\"${next}\">Next: ${names[next]} →</a>` : \"<span></span>\");\n}\n\n/* The demo sequencer — identical on every sector page.\n   steps: [{ t: ms, cap: [title, why], run: fn, reset?: fn }] */\nfunction runSectorDemo(steps) {\n  const caption = document.getElementById(\"caption\");\n  const dots = document.getElementById(\"dots\");\n  const replay = document.getElementById(\"replay\");\n  if (!caption || !dots) return;\n  dots.innerHTML = steps.map(() => \"<i></i>\").join(\"\");\n  let idx = 0, timer = null;\n  const play = () => {\n    clearTimeout(timer);\n    steps.forEach((s) => s.reset && s.reset());\n    [...dots.children].forEach((d) => d.classList.remove(\"done\"));\n    idx = 0;\n    const next = () => {\n      if (idx >= steps.length) { timer = setTimeout(play, 4500); return; }\n      const st = steps[idx];\n      caption.innerHTML = `<span class=\"stepno\">${idx + 1} / ${steps.length}</span>${st.cap[0]}<span class=\"why\">${st.cap[1]}</span>`;\n      st.run();\n      dots.children[idx].classList.add(\"done\");\n      idx++;\n      timer = setTimeout(next, st.t);\n    };\n    next();\n  };\n  if (replay) replay.onclick = play;\n  play();\n}\n\ndocument.addEventListener(\"DOMContentLoaded\", () => { renderNav(); renderPager(); });\n\n<\/script>\n<script>\nconst S=[[\"s0000\",\"御坂美琴推开咖啡店的门，环顾四周。\"],[\"s0001\",\"「姐姐大人，您迟到了十分钟。」\"],[\"s0002\",\"白井黑子坐在窗边，晃了晃手中的杯子。\"],[\"s0003\",\"「初春说她马上就到。」\"],[\"s0004\",\"话音未落，初春饰利推门进来。\"],[\"s0005\",\"「抱歉，我来晚了！」\"],[\"s0006\",\"美琴想起黑子早上提到的风纪委员巡逻。\"]];\nconst box=document.getElementById('items');\nbox.innerHTML=S.map(([id,t],i)=>`<div class=\"item\" id=\"it${i}\"><small>${id}</small>${t}<span class=\"tag\" id=\"flag${i}\" style=\"background:#241a10;color:var(--amber);border:1px solid var(--amber)\">⚑ new scene · cast change · 0.91</span></div>`).join('');\nfunction resetAll(){S.forEach((_,i)=>{const e=document.getElementById('it'+i);e.classList.remove('on','boundary');document.getElementById('flag'+i).classList.remove('show');});document.getElementById('spans').innerHTML='';}\nconst steps=[\n {t:2200,cap:[\"Scan: one noul per sentence\",\"is_scene_boundary is asked for each sentence against the scene-so-far. Most answers come back near 0 — the scene continues.\"],run(){S.forEach((_,i)=>document.getElementById('it'+i).classList.add('on'));}},\n {t:2400,cap:[\"One seam fires: s0004, p = 0.91\",\"A new character pushes the door open — the cast changes and the scene's center of gravity shifts. The flag lands; the reason (cast change) is recorded with it.\"],run(){const e=document.getElementById('it4');e.classList.add('boundary');document.getElementById('flag4').classList.add('show');}},\n {t:2200,cap:[\"Output: scene spans\",\"The window leaves as two spans. Presence, dialogue grouping and extraction all work inside these borders.\"],run(){document.getElementById('spans').innerHTML='<span class=\"chip\">Scene A · s0000–s0003</span> <span class=\"chip\">Scene B · s0004–s0006</span>';}},\n];\nrunSectorDemo(steps.map(s=>({...s,reset:resetAll})));\n<\/script>\n<script>\ndocument.addEventListener('click', function (e) {\n  var a = e.target.closest && e.target.closest('a[href]');\n  if (!a) return;\n  var h = a.getAttribute('href');\n  if (!h || h.indexOf('http') === 0 || h.charAt(0) === '#') return;\n  e.preventDefault();\n  parent.postMessage({ nav: h }, '*');\n}, true);<\/script>\n</body>\n</html>\n","dialogue-detector.html":"<!DOCTYPE html>\n<html lang=\"en\">\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1.0\">\n<title>03 Dialogue detector — novel-ontology-pi design</title>\n<style>\n:root{\n  --bg:#0b0e14; --panel:#121722; --panel2:#171e2e; --line:#26304a;\n  --ink:#e8ecf4; --dim:#9aa7bd; --faint:#5f6d88;\n  --teal:#2dd4bf; --indigo:#818cf8; --amber:#fbbf24; --rose:#fb7185;\n  --green:#4ade80; --violet:#c084fc;\n}\n*{box-sizing:border-box}\nbody{margin:0;background:var(--bg);color:var(--ink);\n  font:15px/1.6 -apple-system,\"Segoe UI\",Roboto,\"Noto Sans CJK SC\",sans-serif;}\n.wrap{max-width:1060px;margin:0 auto;padding:24px 20px 80px}\na{color:var(--teal)}\n\n/* ---------- nav ---------- */\nnav.site{display:flex;flex-wrap:wrap;gap:6px;align-items:center;\n  border-bottom:1px solid var(--line);padding:10px 0 14px;margin-bottom:20px}\nnav.site .brand{font-weight:700;margin-right:14px;color:var(--ink);text-decoration:none}\nnav.site .brand small{display:block;font-weight:400;color:var(--faint);font-size:11px;letter-spacing:.14em;text-transform:uppercase}\nnav.site a.page{color:var(--dim);text-decoration:none;font-size:13.5px;\n  padding:5px 12px;border:1px solid var(--line);border-radius:99px}\nnav.site a.page:hover{color:var(--ink);border-color:var(--teal)}\nnav.site a.page.here{color:#0b0e14;background:var(--teal);border-color:var(--teal);font-weight:600}\n.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;\n  border-top:1px solid var(--line);padding-top:16px}\n.pager a{font-size:13.5px;text-decoration:none}\n\n/* ---------- headers / common ---------- */\n.kicker{color:var(--teal);font-size:12px;letter-spacing:.22em;text-transform:uppercase}\nh1{font-size:32px;margin:6px 0 4px}\nh2{font-size:22px;margin:38px 0 6px;border-left:3px solid var(--teal);padding-left:10px}\nh3{font-size:16px;margin:0 0 4px}\np.sub{color:var(--dim);max-width:780px}\n.badge{display:inline-block;font-size:11px;padding:2px 9px;border-radius:99px;\n  border:1px solid var(--line);color:var(--dim);vertical-align:middle}\n.badge.v1{color:var(--teal);border-color:var(--teal)}\n.badge.open{color:var(--amber);border-color:var(--amber)}\n.badge.cand{color:var(--violet);border-color:var(--violet)}\n.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;\n  padding:18px 20px;margin:14px 0}\n.grid{display:grid;gap:14px}\n.grid.two{grid-template-columns:1fr 1fr}\n.grid.three{grid-template-columns:repeat(3,1fr)}\n@media(max-width:820px){.grid.two,.grid.three{grid-template-columns:1fr}}\n.card{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}\n.card p{margin:4px 0;color:var(--dim);font-size:13.5px}\na.card{text-decoration:none;color:var(--ink);display:block;transition:border-color .2s, transform .2s}\na.card:hover{border-color:var(--teal);transform:translateY(-2px)}\na.card .go{color:var(--teal);font-size:13px}\n.prim{font-family:ui-monospace,Menlo,monospace;font-size:11px;padding:1px 7px;\n  border-radius:6px;background:#0d1220;border:1px solid var(--line)}\n.prim.noul{color:var(--teal)} .prim.choice{color:var(--indigo)} .prim.score{color:var(--amber)}\ncode{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;color:var(--indigo)}\n.mono{font-family:ui-monospace,Menlo,monospace}\nul.tight{margin:6px 0;padding-left:18px;color:var(--dim);font-size:13.5px}\nul.tight li{margin:3px 0}\nfooter{margin-top:48px;border-top:1px solid var(--line);padding-top:16px;color:var(--faint);font-size:13px}\n\n/* ---------- flow diagram ---------- */\n.flow{display:flex;align-items:stretch;gap:0;flex-wrap:wrap}\n.node{flex:1;min-width:150px;background:var(--panel2);border:1px solid var(--line);\n  border-radius:12px;padding:12px 14px;position:relative}\n.node b{display:block;font-size:14px}\n.node span{color:var(--dim);font-size:12.5px}\n.arrow{align-self:center;padding:0 8px;color:var(--faint);font-size:20px;position:relative}\n.arrow::after{content:\"\";position:absolute;top:50%;left:2px;width:6px;height:6px;\n  border-radius:50%;background:var(--teal);animation:travel 1.6s linear infinite}\n@keyframes travel{0%{transform:translate(0,-50%);opacity:0}15%{opacity:1}\n  85%{opacity:1}100%{transform:translate(22px,-50%);opacity:0}}\n\n/* ---------- architecture graph (SVG) ---------- */\n.arch{width:100%;height:auto;display:block}\n.arch .box{fill:#171e2e;stroke:#26304a;rx:12}\n.arch .box.sys1{stroke:var(--teal)}\n.arch .box.sys2{stroke:var(--indigo)}\n.arch .box.ext{stroke:#3a3f55;stroke-dasharra
